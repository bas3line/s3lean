[package]
name = "s3lean"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "A lean S3 client: signed PutObject, GetObject, HeadObject, DeleteObject and presigned URLs, on the HTTP client you already have"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bas3line/s3lean"
documentation = "https://docs.rs/s3lean"
readme = "README.md"
keywords = ["s3", "r2", "minio", "sigv4", "object-storage"]
categories = ["api-bindings", "web-programming::http-client"]
include = ["/src/**", "/Cargo.toml", "/README.md", "/LICENSE-*", "/CHANGELOG.md"]

[dependencies]
hmac = "0.12"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }
ureq = { version = "3", optional = true }

[features]
default = []
reqwest = ["dep:reqwest"]
ureq = ["dep:ureq"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[package.metadata.docs.rs]
all-features = true

[[example]]
name = "put"
required-features = ["reqwest"]

[[example]]
name = "presign"
