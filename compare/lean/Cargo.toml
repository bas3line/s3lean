[package]
name = "cmp-lean"
version = "0.1.0"
edition = "2021"
[dependencies]
s3lean = { path = "../..", features = ["reqwest"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
[workspace]
